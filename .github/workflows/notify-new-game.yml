name: NekoVault Publish Games

on:
  push:
    branches:
      - main
    paths:
      - notifications.js

permissions:
  contents: write

# Hindari dua proses publikasi berjalan bersamaan.
concurrency:
  group: nekovault-game-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect new games and set WITA timestamps
        id: prepare
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const { execFileSync } = require("child_process");

          const outputFile = process.env.GITHUB_OUTPUT;
          const setOutput = (name, value) =>
            fs.appendFileSync(outputFile, `${name}=${value}\n`);

          function loadGames(source) {
            const context = { window: {} };
            vm.runInNewContext(source, context);
            const games = context.window.NEKO_NOTIFICATIONS;
            if (!Array.isArray(games)) {
              throw new Error("window.NEKO_NOTIFICATIONS bukan array yang valid.");
            }
            return games;
          }

          const before = process.env.BEFORE_SHA;
          if (!before || /^0+$/.test(before)) {
            console.log("Commit awal tidak diproses otomatis.");
            setOutput("has_new_games", "false");
            process.exit(0);
          }

          let oldSource;
          try {
            oldSource = execFileSync(
              "git", ["show", `${before}:notifications.js`],
              { encoding: "utf8" }
            );
          } catch (error) {
            throw new Error(
              "Tidak dapat membaca notifications.js dari commit sebelumnya."
            );
          }

          const source = fs.readFileSync("notifications.js", "utf8");
          const oldGames = loadGames(oldSource);
          const games = loadGames(source);
          const oldIds = new Set(oldGames.map(game => game.id).filter(Boolean));
          const added = games.filter(game => game.id && !oldIds.has(game.id));

          if (added.length === 0) {
            console.log("Tidak ada ID game baru. Tidak mengirim notifikasi.");
            setOutput("has_new_games", "false");
            process.exit(0);
          }

          // Satu waktu publikasi WITA untuk semua game baru dalam commit yang sama.
          const now = new Date();
          const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Makassar",
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            hourCycle: "h23"
          }).formatToParts(now);
          const part = Object.fromEntries(parts.map(p => [p.type, p.value]));
          const timestamp =
            `${part.year}-${part.month}-${part.day}T` +
            `${part.hour}:${part.minute}:${part.second}.` +
            `${String(now.getMilliseconds()).padStart(3, "0")}+08:00`;

          const addedIds = new Set(added.map(game => game.id));
          let stamped = 0;
          for (const game of games) {
            if (addedIds.has(game.id) && !game.publishedAt) {
              game.publishedAt = timestamp;
              stamped++;
            }
          }

          // Pertahankan komentar/petunjuk di bagian atas file.
          const marker = "window.NEKO_NOTIFICATIONS =";
          const markerIndex = source.indexOf(marker);
          if (markerIndex < 0) {
            throw new Error("Deklarasi window.NEKO_NOTIFICATIONS tidak ditemukan.");
          }
          const header = source.slice(0, markerIndex);
          const updatedSource =
            header + marker + " " + JSON.stringify(games, null, 4) + ";\n";
          fs.writeFileSync("notifications.js", updatedSource, "utf8");

          fs.writeFileSync(
            "new-game-ids.json",
            JSON.stringify(added.map(game => game.id)),
            "utf8"
          );

          setOutput("has_new_games", "true");
          setOutput("timestamp_changed", stamped > 0 ? "true" : "false");
          console.log(`${added.length} game baru ditemukan.`);
          console.log(`${stamped} timestamp WITA ditambahkan: ${timestamp}`);
          console.log(added.map(game => `- ${game.title}`).join("\n"));
          NODE

      - name: Save timestamps to GitHub
        if: steps.prepare.outputs.has_new_games == 'true' && steps.prepare.outputs.timestamp_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications.js
          git commit -m "chore: set WITA publication timestamps for new games"
          git push

      - name: Send push notification
        if: steps.prepare.outputs.has_new_games == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          function loadGames(source) {
            const context = { window: {} };
            vm.runInNewContext(source, context);
            return context.window.NEKO_NOTIFICATIONS || [];
          }

          const ids = new Set(JSON.parse(fs.readFileSync("new-game-ids.json", "utf8")));
          const games = loadGames(fs.readFileSync("notifications.js", "utf8"));
          const added = games.filter(game => ids.has(game.id));
          if (added.length === 0) {
            throw new Error("Daftar game baru tidak ditemukan untuk notifikasi.");
          }

          const count = added.length;
          const title = `🎮 ${count} Game Baru Telah Ditambahkan!`;
          const gameTitles = added.map(game => `• ${game.title}`).join("\n");
          const body =
            `Ada ${count} game baru yang sudah tersedia di NekoVault! 🎉\n\n` +
            `${gameTitles}\n\nSelamat bermain! 🎉`;

          async function sendNotification() {
            if (!process.env.SUPABASE_URL || !process.env.PUSH_ADMIN_TOKEN) {
              throw new Error("SUPABASE_URL atau PUSH_ADMIN_TOKEN belum tersedia di GitHub Secrets.");
            }
            const response = await fetch(
              `${process.env.SUPABASE_URL}/functions/v1/send-game-notification`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.PUSH_ADMIN_TOKEN}`
                },
                body: JSON.stringify({
                  title,
                  body,
                  url: "https://nekovaultgame.pages.dev/"
                })
              }
            );
            const result = await response.text();
            console.log("Supabase response:", result);
            if (!response.ok) {
              throw new Error(`Notification failed: HTTP ${response.status}`);
            }
          }

          sendNotification().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
