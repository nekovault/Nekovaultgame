<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">\n    <link rel="stylesheet" href="catalog-menu.css">

    <title>Catalog - NekoVault</title>

</head>

<body>

    <!-- HEADER -->
    <header class="header">

    <a href="index.html" class="logo">
        <img src="assets/logo/logo.png" alt="Gaming NekoVault">
    </a>

    <div class="header-right">

        <button class="notification-btn" id="notificationBtn" type="button"
            aria-label="Buka notifikasi" aria-expanded="false" aria-controls="notificationPanel">
            <i class="ri-notification-3-line" aria-hidden="true"></i>
            <span class="notification-unread-dot" id="notificationUnreadDot" hidden></span>
        </button>

        <button class="icon-btn" id="menuBtn">

          <span class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>

        </button>
        
    </div>

</header>
    
<!-- PANEL NOTIFIKASI -->
<div class="notification-panel" id="notificationPanel" hidden>
    <div class="notification-panel-header">
        <h2>Notifikasi</h2>
        <button type="button" class="notification-mark-all" id="notificationMarkAll">Tandai dibaca</button>
    </div>
    <div class="notification-list" id="notificationList" aria-live="polite">
        <p class="notification-empty">Memuat notifikasi...</p>
    </div>
</div>

    <!-- MENU PANEL -->
<div class="menu-panel" id="menuPanel">

    <div class="menu-search">
        <i class="ri-search-line"></i>

        <input
    type="text"
    id="searchInput"
    placeholder="Search games..."
    
    >
    
    </div>
    
    <div class="search-results" id="searchResults">
    </div>

    <button class="menu-item menu-accordion" id="genresToggle" type="button"
        aria-expanded="false" aria-controls="genresPanel">
        <span>Genres</span>
        <i class="ri-arrow-down-s-line"></i>
    </button>
    <section class="menu-filter-panel" id="genresPanel" hidden>
        <h3 class="menu-filter-heading">🏷️ GENRE <span id="genreCount">• 0</span></h3>
        <div class="genre-tags" id="genreTags"></div>
        <button class="menu-reset-filter" id="clearGenreFilter" type="button">Semua genre</button>
    </section>

    <button class="menu-item menu-accordion" id="enginesToggle" type="button"
        aria-expanded="false" aria-controls="enginesPanel">
        <span>Engines</span>
        <i class="ri-arrow-down-s-line"></i>
    </button>
    <section class="menu-filter-panel engine-panel" id="enginesPanel" hidden>
        <div class="engine-options" id="engineOptions">
            <button type="button" data-engine="Ren'Py">Ren'Py</button>
            <button type="button" data-engine="RPG Maker">RPGM</button>
            <button type="button" data-engine="Unity">Unity</button>
        </div>
        <button class="menu-reset-filter" id="clearEngineFilter" type="button">Semua engine</button>
    </section>

</div>


     <!-- CATALOG HEADER -->
<h1 class="catalog-title">Catalog Game</h1>

<div class="catalog-sort">

    <span class="sort-label">Sort:</span>

    <button id="sortNewest" class="sort-btn active">
        Terbaru
    </button>

    <button id="sortAZ" class="sort-btn">
        A-Z
    </button>

</div>

<div class="catalog-info">

    <span id="gameCount">0 Games</span>

    <button id="filterBtn" class="filter-btn">
        Filter
    </button>

</div>


<!-- =========================
     FILTER ENGINE
========================= -->

<div id="filterPanel" class="filter-panel">

    <button data-engine="all">
        Semua
    </button>

    <button data-engine="Ren'Py">
        Ren'Py
    </button>

    <button data-engine="RPG Maker">
        RPG Maker
    </button>

    <button data-engine="Unity">
        Unity
    </button>

</div>

<h2 class="catalog-title">Semua Game</h2>

<div class="catalog-grid" id="catalogGrid">
</div>
    
    
     <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        <i class="ri-home-5-line"></i>
        <span>Home</span>
    </a>

    <a href="catalog.html" class="nav-item active">
        <i class="ri-apps-2-line"></i>
        <span>Catalog</span>
    </a>

    <a href="traktir.html" class="nav-item">
        <i class="ri-cup-line"></i>
        <span>Traktir</span>
    </a>

    <a href="panduan.html" class="nav-item">
        <i class="ri-question-line"></i>
        <span>Panduan</span>
    </a>

</nav>

    <script src="game.js"></script>
    <script src="notifications.js"></script>
    <script src="script.js"></script>
    <script src="catalog.js"></script>
    <script src="search.js"></script>
        
</body>
</html>
